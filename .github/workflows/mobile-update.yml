name: App parents — mise à jour OTA

# Publie le bundle JS de l'app parents sur EAS Update. Les téléphones déjà
# installés le récupèrent au lancement suivant : pas de nouveau build, pas de
# passage par les stores.
#
# Tout push sur main touchant mobile/ part DIRECTEMENT en production, sans
# validation humaine. Les deux barrières ci-dessous en tiennent lieu : le
# typecheck, et le contrôle de la configuration Supabase. Si l'une échoue,
# rien n'est publié et les téléphones gardent la version précédente.
#
# ATTENTION — une OTA ne suffit PAS si le changement touche le natif :
# nouveau module ou plugin Expo, montée de version du SDK / React Native,
# google-services.json, icônes, permissions… ou si `version` change dans
# mobile/app.json. Dans ces cas il faut relancer `eas build`.
#
# `runtimeVersion` suit `version` (policy "appVersion") : tant que `version`
# reste 1.2.0, les mises à jour atteignent les installations existantes.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      # Le pipeline se valide lui-même : sans cette ligne, un push qui ne
      # corrige que ce fichier ne déclenche aucune publication, et la
      # correction reste invérifiable jusqu'au prochain changement mobile.
      - ".github/workflows/mobile-update.yml"
  # Publication à la demande — sert surtout à viser le canal preview.
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal EAS"
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  group: mobile-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: eas update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    env:
      # Un push automatique vise la production ; le déclenchement manuel choisit.
      CHANNEL: ${{ inputs.channel || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # eas-cli est installé avec npm, et non via expo/expo-github-action :
      # cette action passe par `yarn global add`, qui échoue sur l'image du
      # runner (« /usr/local/bin/yarn failed with exit code 1 ») avant même
      # d'atteindre l'authentification. Le jeton du robot github-actions (créé
      # sur expo.dev, déposé dans Settings → Secrets and variables → Actions →
      # EXPO_TOKEN) est lu nativement par eas-cli depuis l'environnement.
      - name: Installer eas-cli
        run: npm install --global eas-cli@latest

      - name: Installer les dépendances
        run: npm ci

      # Barrière 1 — du code qui ne compile pas ne part pas sur les téléphones.
      - name: Vérifier les types
        run: npm run typecheck

      # `eas update` ne lit PAS le bloc `env` des profils de build d'eas.json :
      # sans cette étape, le bundle part sans EXPO_PUBLIC_SUPABASE_URL, isLiveMode
      # passe à false et l'app sert les données de démonstration (mock.ts).
      # On recopie donc le profil dans l'environnement du job.
      - name: Charger les variables du profil EAS
        run: |
          node -e '
            const fs = require("fs");
            const profile = process.env.CHANNEL;
            const build = JSON.parse(fs.readFileSync("eas.json", "utf8")).build ?? {};
            const vars = build[profile]?.env ?? {};
            const names = Object.keys(vars);
            if (!names.length) {
              console.error(`Profil « ${profile} » sans bloc env dans eas.json.`);
              process.exit(1);
            }
            for (const [k, v] of Object.entries(vars)) {
              if (String(v).includes("\n")) { console.error(`${k} contient un saut de ligne.`); process.exit(1); }
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
            }
            console.log("Variables chargées :", names.join(", "));
          '

      # Barrière 2 — plutôt échouer que publier un bundle en mode démonstration.
      - name: Vérifier la configuration Supabase
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "EXPO_PUBLIC_SUPABASE_URL vide — publication annulée."; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "EXPO_PUBLIC_SUPABASE_ANON_KEY vide — publication annulée."; exit 1; }
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1*|http://localhost*|http://192.168.*|http://10.*)
              echo "URL Supabase locale ($EXPO_PUBLIC_SUPABASE_URL) — publication annulée."; exit 1 ;;
          esac
          echo "Canal : $CHANNEL — cible Supabase : $EXPO_PUBLIC_SUPABASE_URL"

      # Le message passe par l'environnement, jamais par interpolation directe
      # dans la commande : un message de commit peut contenir n'importe quoi.
      - name: Publier la mise à jour
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-Publication manuelle}" | head -n 1)"
          eas update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive
