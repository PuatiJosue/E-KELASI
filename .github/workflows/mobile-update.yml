name: App parents — mise à jour OTA

# Publie le bundle JS de l'app parents sur EAS Update. Les téléphones déjà
# installés le récupèrent au lancement suivant : pas de nouveau build, pas de
# passage par les stores.
#
# ATTENTION — une OTA ne suffit PAS si le changement touche le natif :
# nouveau module ou plugin Expo, montée de version du SDK / React Native,
# google-services.json, icônes, permissions… ou si `version` change dans
# mobile/app.json. Dans ces cas il faut relancer `eas build`.
#
# `runtimeVersion` suit `version` (policy "appVersion") : tant que `version`
# reste 1.2.0, les mises à jour atteignent les installations existantes.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  # Publication manuelle — c'est par ici qu'on pousse en production.
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal EAS"
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: mobile-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: eas update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Jeton à créer sur expo.dev (Access Tokens) puis à déposer dans
      # Settings → Secrets and variables → Actions → EXPO_TOKEN.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      # `eas update` ne lit PAS le bloc `env` des profils de build d'eas.json :
      # sans cette étape, le bundle part sans EXPO_PUBLIC_SUPABASE_URL, isLiveMode
      # passe à false et l'app sert les données de démonstration (mock.ts).
      # On recopie donc le profil dans l'environnement du job.
      - name: Charger les variables du profil EAS
        env:
          PROFILE: ${{ inputs.channel || 'preview' }}
        run: |
          node -e '
            const fs = require("fs");
            const profile = process.env.PROFILE;
            const build = JSON.parse(fs.readFileSync("eas.json", "utf8")).build ?? {};
            const vars = build[profile]?.env ?? {};
            const names = Object.keys(vars);
            if (!names.length) {
              console.error(`Profil « ${profile} » sans bloc env dans eas.json.`);
              process.exit(1);
            }
            for (const [k, v] of Object.entries(vars)) {
              if (String(v).includes("\n")) { console.error(`${k} contient un saut de ligne.`); process.exit(1); }
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
            }
            console.log("Variables chargées :", names.join(", "));
          '

      # Garde-fou : plutôt échouer que publier un bundle en mode démonstration.
      - name: Vérifier la configuration Supabase
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "EXPO_PUBLIC_SUPABASE_URL vide — publication annulée."; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "EXPO_PUBLIC_SUPABASE_ANON_KEY vide — publication annulée."; exit 1; }
          echo "Cible Supabase : $EXPO_PUBLIC_SUPABASE_URL"

      # Le message passe par l'environnement, jamais par interpolation directe
      # dans la commande : un message de commit peut contenir n'importe quoi.
      - name: Publier la mise à jour
        env:
          CHANNEL: ${{ inputs.channel || 'preview' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-Publication manuelle}" | head -n 1)"
          eas update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive
